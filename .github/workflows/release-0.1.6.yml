name: Release 0.1.6

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ./openclaw
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=0.1.6
            BUILD_ARCH=aarch64
          tags: |
            ghcr.io/making-lemonade/openclaw-haos-addon:0.1.6
