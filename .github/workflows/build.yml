name: Validate ARM64 add-on

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Raspberry Pi 5 image
        uses: docker/build-push-action@v6
        with:
          context: ./openclaw
          platforms: linux/arm64
          push: false
          build-args: |
            BUILD_VERSION=0.1.0
            BUILD_ARCH=aarch64
          tags: openclaw-haos-addon:test
