name: Build and publish ARM64 add-on

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./openclaw
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BUILD_VERSION=0.1.3
            BUILD_ARCH=aarch64
          tags: |
            ghcr.io/making-lemonade/openclaw-haos-addon:0.1.3
            ghcr.io/making-lemonade/openclaw-haos-addon:latest
          labels: |
            org.opencontainers.image.source=https://github.com/making-lemonade/openclaw-haos-addon
            org.opencontainers.image.version=0.1.3
