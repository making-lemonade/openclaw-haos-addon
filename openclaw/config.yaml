name: OpenClaw
version: "0.1.6"
slug: openclaw
description: "Isolated OpenClaw gateway for Home Assistant OS, using an OpenAI-compatible model server such as LM Studio on your LAN"
url: "https://github.com/making-lemonade/openclaw-haos-addon"
image: "ghcr.io/making-lemonade/openclaw-haos-addon"
arch:
  - aarch64
startup: application
boot: auto
init: false
stage: experimental
backup: cold
host_network: false
host_ipc: false
host_pid: false
host_uts: false
privileged: []
full_access: false
apparmor: true
hassio_api: false
homeassistant_api: false
docker_api: false
auth_api: false
audio: false
video: false
gpio: false
usb: false
uart: false
udev: false
devicetree: false
kernel_modules: false
tmpfs: true
ports:
  18789/tcp: 18789
ports_description:
  18789/tcp: OpenClaw Gateway / Control UI
options:
  lm_studio_url: null
  lm_studio_model: null
  lm_studio_api_key: ""
  gateway_token: null
  control_ui_origin: "http://homeassistant.local:18789"
  pairing_mode: false
  approve_pairing_request: ""
  clear_internal_logs_on_start: false
schema:
  lm_studio_url: url
  lm_studio_model: str
  lm_studio_api_key: password?
  gateway_token: password
  control_ui_origin: url
  pairing_mode: bool
  approve_pairing_request: str?
  clear_internal_logs_on_start: bool
