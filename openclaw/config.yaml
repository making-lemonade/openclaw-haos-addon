name: OpenClaw
version: "0.1.12"
slug: openclaw
description: "Isolated OpenClaw gateway for Home Assistant OS; configure models and providers in the native OpenClaw Control UI"
url: "https://github.com/making-lemonade/openclaw-haos-addon"
image: "ghcr.io/making-lemonade/openclaw-haos-addon"
arch:
  - aarch64
startup: application
boot: auto
init: false
stage: experimental
backup: cold
host_network: false
host_ipc: false
host_pid: false
host_uts: false
privileged: []
full_access: false
apparmor: true
hassio_api: false
homeassistant_api: false
docker_api: false
auth_api: false
audio: false
video: false
gpio: false
usb: false
uart: false
udev: false
devicetree: false
kernel_modules: false
tmpfs: true
ports:
  18789/tcp: 18789
ports_description:
  18789/tcp: OpenClaw Gateway / Control UI
options:
  lm_studio_url: ""
  lm_studio_model: ""
  lm_studio_api_key: ""
  gateway_password: ""
  gateway_token: ""
  control_ui_origin: "http://homeassistant.local:18789"
  log_level: "warn"
  pairing_mode: false
  approve_pairing_request: ""
schema:
  lm_studio_url: url?
  lm_studio_model: str?
  lm_studio_api_key: password?
  gateway_password: password?
  gateway_token: password?
  control_ui_origin: url
  log_level: list(error|warn|info|debug)
  pairing_mode: bool
  approve_pairing_request: str?
