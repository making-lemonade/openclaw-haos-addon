---
configuration:
  lm_studio_url:
    name: URL legacy del server modello
    description: >-
      Campo di compatibilità obsoleto. Dalla versione 0.1.11 questa opzione HAOS
      viene ignorata. Configura LM Studio e gli altri provider direttamente nella
      Control UI nativa di OpenClaw.
  lm_studio_model:
    name: ID modello legacy
    description: >-
      Campo di compatibilità obsoleto. Dalla versione 0.1.11 questa opzione HAOS
      viene ignorata. Seleziona e configura i modelli direttamente nella Control UI.
  lm_studio_api_key:
    name: Chiave API legacy del server modello
    description: >-
      Campo di compatibilità obsoleto. Dalla versione 0.1.11 questa opzione HAOS
      viene ignorata. Configura l'autenticazione del provider direttamente in OpenClaw.
  gateway_password:
    name: Password iniziale del Gateway
    description: >-
      Password di bootstrap opzionale usata solo se OpenClaw non ha ancora una
      password Gateway nativa. Se lasciata vuota, la 0.1.13 genera una password
      casuale per il primo accesso e la stampa una sola volta nel log dell'app.
      Dopo il primo accesso cambiala nella Control UI nativa di OpenClaw: il wrapper
      conserverà la password impostata lì.
  gateway_token:
    name: Token Gateway legacy
    description: >-
      Campo di compatibilità obsoleto. Dalla versione 0.1.13 questo valore viene
      ignorato. L'autenticazione Gateway usa ora la password nativa di OpenClaw.
  control_ui_origin:
    name: Origine browser della Control UI
    description: >-
      Origine autorizzata ad accedere alla Control UI. Deve corrispondere
      esattamente a come apri l'interfaccia, inclusi protocollo, host e porta.
  log_level:
    name: Livello log OpenClaw
    description: >-
      Controlla quante righe OpenClaw invia al registro dell'app Home Assistant.
      "warn" è consigliato per l'uso normale; usa "info" o "debug" solo per diagnosi.
  pairing_mode:
    name: Modalità ricerca pairing browser
    description: >-
      Modalità temporanea di manutenzione per mostrare le richieste di pairing pendenti.
  approve_pairing_request:
    name: Request ID di pairing da approvare
    description: >-
      requestId esatto ottenuto dalla modalità ricerca pairing. Svuota il campo
      dopo che il browser si è collegato.
