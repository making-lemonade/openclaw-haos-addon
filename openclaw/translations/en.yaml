---
configuration:
  lm_studio_url:
    name: Legacy model server URL
    description: >-
      Deprecated compatibility field. OpenClaw 0.1.11 and later ignore this
      HAOS option. Configure LM Studio and other model providers directly in
      the native OpenClaw Control UI.
  lm_studio_model:
    name: Legacy model ID
    description: >-
      Deprecated compatibility field. OpenClaw 0.1.11 and later ignore this
      HAOS option. Select and configure models directly in the Control UI.
  lm_studio_api_key:
    name: Legacy model server API key
    description: >-
      Deprecated compatibility field. OpenClaw 0.1.11 and later ignore this
      HAOS option. Configure provider authentication directly in OpenClaw.
  gateway_password:
    name: OpenClaw Gateway password
    description: >-
      Password used by the Control UI to authenticate to the Gateway. It is
      supplied through OPENCLAW_GATEWAY_PASSWORD and is not stored in openclaw.json.
  gateway_token:
    name: Legacy Gateway token
    description: >-
      Kept temporarily for upgrade compatibility. If gateway_password is empty,
      0.1.12 uses this value as a temporary password. Set gateway_password and
      then clear this legacy field.
  control_ui_origin:
    name: Control UI browser origin
    description: >-
      Browser-visible origin allowed to access the OpenClaw Control UI. It must
      exactly match the scheme, host and port used to open the UI.
  log_level:
    name: OpenClaw log level
    description: >-
      Controls OpenClaw app log verbosity. "warn" is recommended for normal use;
      use "info" or "debug" temporarily for troubleshooting.
  pairing_mode:
    name: Browser pairing discovery mode
    description: >-
      Temporary maintenance mode used to show pending Control UI pairing requests.
  approve_pairing_request:
    name: Pairing request ID to approve
    description: >-
      Exact requestId obtained from pairing discovery mode. Clear it after the
      browser connects.
